<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Calendar Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
        }

        h1 {
            color: #243b64;
        }

        .inputs {
            margin: 20px 0;
        }

        label {
            font-weight: bold;
            margin: 10px;
        }

        input {
            padding: 8px;
            margin: 8px;
            width: 100px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .generate {
            background-color: #2563eb;
            color: white;
        }

        .reset {
            background-color: #dc2626;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            table-layout: fixed;
        }

        th {
            background-color: #243b64;
            color: white;
            padding: 12px 2px;
        }

        td {
            border: 1px solid #ddd;
            height: 45px;
            text-align: center;
        }

        td:not(:empty) {
            background-color: #f8fafc;
        }

        td:not(:empty):hover {
            background-color: #bfdbfe;
        }

        #message {
            color: #dc2626;
            margin-top: 15px;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 12px;
            }

            th {
                font-size: 12px;
                padding: 8px 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Monthly Calendar</h1>
        <p>Enter a year and month to generate a calendar.</p>

        <div class="inputs">
            <label for="year">Year:</label>
            <input type="number" id="year"
                   placeholder="2026" min="1" max="9999">

            <br>

            <label for="month">Month:</label>
            <input type="number" id="month"
                   placeholder="1-12" min="1" max="12">
        </div>

        <button class="generate" onclick="generateCalendar()">
            Generate Calendar
        </button>

        <button class="reset" onclick="resetCalendar()">
            Reset
        </button>

        <h2 id="calendarTitle"></h2>

        <div id="calendar"></div>

        <p id="message"></p>
    </div>

    <script>
        function generateCalendar() {
            const year = Number(document.getElementById("year").value);
            const month = Number(document.getElementById("month").value);

            const calendar = document.getElementById("calendar");
            const title = document.getElementById("calendarTitle");
            const message = document.getElementById("message");

            calendar.innerHTML = "";
            title.textContent = "";
            message.textContent = "";

            // Validate the input
            if (
                !Number.isInteger(year) ||
                !Number.isInteger(month) ||
                year < 1 || year > 9999 ||
                month < 1 || month > 12
            ) {
                message.textContent =
                    "Please enter a valid year (1-9999) and month (1-12).";
                return;
            }

            // Find the starting day of the month
            const firstDay = new Date(year, month - 1, 1).getDay();

            // Find the number of days in the month
            const daysInMonth =
                new Date(year, month, 0).getDate();

            // Display month and year
            const monthName = new Date(
                year, month - 1, 1
            ).toLocaleString("en-US", { month: "long" });

            title.textContent = monthName + " " + year;

            // Create calendar table
            let table = document.createElement("table");

            // Create weekday headings
            let header = document.createElement("tr");
            const weekdays = [
                "Sunday", "Monday", "Tuesday",
                "Wednesday", "Thursday", "Friday", "Saturday"
            ];

            weekdays.forEach(function(day) {
                let th = document.createElement("th");
                th.textContent = day.substring(0, 3);
                th.title = day;
                header.appendChild(th);
            });

            table.appendChild(header);

            // Create calendar dates
            let row = document.createElement("tr");

            // Add empty cells before the first day
            for (let i = 0; i < firstDay; i++) {
                row.appendChild(document.createElement("td"));
            }

            // Add each date to the calendar
            for (let date = 1; date <= daysInMonth; date++) {
                let cell = document.createElement("td");
                cell.textContent = date;
                row.appendChild(cell);

                // Start a new row after Saturday
                if ((firstDay + date) % 7 === 0) {
                    table.appendChild(row);
                    row = document.createElement("tr");
                }
            }

            // Add the final row if it contains dates
            if (row.children.length > 0) {
                while (row.children.length < 7) {
                    row.appendChild(document.createElement("td"));
                }
                table.appendChild(row);
            }

            calendar.appendChild(table);
        }

        function resetCalendar() {
            document.getElementById("year").value = "";
            document.getElementById("month").value = "";
            document.getElementById("calendarTitle").textContent = "";
            document.getElementById("calendar").innerHTML = "";
            document.getElementById("message").textContent = "";
        }
    </script>

</body>
</html>
